<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemforge Chronicles</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="hud"><span id="loc"></span><span id="gold"></span><span class="hint">Move: Arrows/WASD · Menu: Esc/M</span></div>
  <canvas id="map" width="512" height="384"></canvas>
  <div id="dpad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button><button data-d="menu">☰</button></div>
  <div id="overlay"></div>
</div>
<script type="module" src="src/game.js"></script>
</body>
</html>
