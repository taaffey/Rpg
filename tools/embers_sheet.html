<!doctype html><body style="background:#222;margin:8px"><canvas id=c></canvas>
<script type=module>
// contact sheet of the Cinder Isle sprites: open /tools/embers_sheet.html[?z=3&ids=a,b,c] on a local server
import * as BA from '../src/battleart.js';
const q = new URLSearchParams(location.search), z = +q.get('z') || 3;
const ids = (q.get('ids') || 'cinder_imp,pepperoni_salamander,garlic_knot,anchovy_eel,magma_slime,basalt_golem,fire_eater,stag_wraith,margherita').split(',');
const arts = ids.map((id) => [id, BA.enemyArt(id)]).filter(([, s]) => s);
const cols = +q.get('cols') || 4, cw = Math.max(...arts.map(([, s]) => s.width)) * z + 16, ch = Math.max(...arts.map(([, s]) => s.height)) * z + 24;
const c = document.getElementById('c'); c.width = cw * Math.min(cols, arts.length) + 8; c.height = ch * Math.ceil(arts.length / cols) + 8;
const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.fillStyle = '#58463c'; x.fillRect(0, 0, c.width, c.height);
arts.forEach(([id, s], i) => { const ox = 8 + (i % cols) * cw, oy = 8 + Math.floor(i / cols) * ch; x.drawImage(s, ox, oy, s.width * z, s.height * z); x.fillStyle = '#fff'; x.font = '10px monospace'; x.fillText(id + ' ' + s.width + 'x' + s.height, ox, oy + ch - 10); });
document.title = 'ready';
</script>
